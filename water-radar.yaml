substitutions:
    device_name: water-radar
    friendly_name: Water Radar

external_components:
    - source: github://Averyy/esphome-custom-components
      components: [hlk_ld8001h, notecard]

packages:
    # Select ESP32 Board:
    device_base: !include common/device_esp32dev.yaml
    # device_base: !include common/device_esp32c3_mini.yaml
    # device_base: !include common/device_esp32c6_firebeetle.yaml

    # Optional Features:
    mosfet_control: !include common/mosfet_control.yaml #mosfet_pin on at boot, off at sleep

output:
    - platform: gpio
      pin: GPIO2
      id: mosfet_pin

# Notecard configuration
notecard:
    id: notecard_component
    uart_id: uart_notecard
    project_id: !secret notecard_project_id
    sync_interval: 6h #uses 2h measurements
    org: !secret notecard_org

uart:
    - id: uart_radar
      tx_pin: GPIO25
      rx_pin: GPIO26
      baud_rate: 115200
    - id: uart_notecard
      tx_pin: GPIO17
      rx_pin: GPIO16
      baud_rate: 9600

sensor:
    - platform: hlk_ld8001h
      uart_id: uart_radar
      name: "Distance to Water"
      unit_of_measurement: "mm"
      update_interval: 3s
      range: 2.5m # Max detection range. Default 10m (0.15m - 40m)
      filters:
          # Ignore the first 10 readings during sensor warmup
          - skip_initial: 10
          # Filter out zero values (invalid readings)
          - filter_out: 0
          # Timeout if no valid reading after 60s
          - timeout:
                timeout: 60s
                value: 0
      on_value:
          then:
              - lambda: |-
                    // Get distance from radar
                    float distance = x;
                    ESP_LOGD("main", "Received distance: %.2f mm", distance);

                    // Get values from Notecard
                    float temperature = id(notecard_component).get_notecard_temperature();
                    float battery_voltage = id(notecard_component).get_notecard_battery_voltage();
                    ESP_LOGD("main", "Notecard temp: %.2f C, battery: %.2f V", temperature, battery_voltage);

                    // Create JSON with all values
                    std::string json = "{";
                    json += "\"type\":\"water\"";
                    json += ",\"distance\":" + to_string(distance);
                    json += ",\"temperature\":" + to_string(temperature);
                    json += ",\"batteryVoltage\":" + to_string(battery_voltage);
                    json += "}";

                    ESP_LOGD("main", "Sending: %s", json.c_str());

                    bool success = id(notecard_component).send_data(json);
                    ESP_LOGD("main", "Data send %s", success ? "successful" : "failed");

                    // Give time for Notecard communication to complete
                    ESP_LOGD("main", "Going to sleep in 1s...");
                    delay(1000);

              - deep_sleep.enter: deep_sleep_mode

# Deep sleep configuration
deep_sleep:
    id: deep_sleep_mode
    run_duration: 5min #sleep on stall or fail
    sleep_duration: 2h
