# common/wifi_battery.yaml
# Battery-optimized WiFi configuration for deep sleep devices
# - Uses LIGHT power save mode to reduce radio power consumption
# - Enables fast_connect to skip channel scanning
# - Disables AP fallback to avoid running an access point on WiFi failure
# - Disables reboot timeout so deep_sleep run_duration handles recovery
wifi:
    id: wifi_id
    networks:
        - ssid: !secret secondary_wifi_ssid
          password: !secret secondary_wifi_password
        - ssid: !secret home_wifi_ssid
          password: !secret home_wifi_password
    power_save_mode: LIGHT
    fast_connect: true
    reboot_timeout: 0s
